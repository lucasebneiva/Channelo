<div class="min-h-screen flex flex-col">
  <!-- Navbar using the custom gradient -->
  <header class="bg-linear-to-r from-brand-start to-brand-end shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        
        <!-- Logo -->
        <div class="shrink-0 flex items-center">
          <span class="text-white font-bold text-2xl tracking-tight">Channelo</span>
        </div>
        
        <!-- Navigation Placeholder (We'll wire these up in Step 3) -->
        <nav class="flex space-x-4">
          <a class="text-white hover:text-white/80 px-3 py-2 rounded-md text-sm font-medium cursor-pointer transition-colors">
            Login
          </a>
          <a class="bg-white text-brand-end hover:bg-gray-100 px-4 py-2 rounded-md text-sm font-bold shadow-sm cursor-pointer transition-colors">
            Register
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Application Content -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col">
    <!-- TEMPORARY TEST BLOCK -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-8 border border-gray-200">
      <h2 class="text-xl font-bold mb-4">Auth State Test</h2>
      <p class="mb-2">Authenticated: <span class="font-bold text-brand-start">{{ auth.isAuthenticated() }}</span></p>
      
      @if (auth.isAuthenticated()) {
        <div class="mb-4 p-4 bg-green-50 text-green-800 rounded">
          <p>Welcome, {{ auth.currentUser()?.displayName }}!</p>
          <p>Email: {{ auth.currentUser()?.email }}</p>
        </div>
        <button (click)="auth.logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded shadow transition-colors">
          Logout
        </button>
      } @else {
        <button (click)="testLogin()" class="bg-brand-start hover:bg-brand-end text-white px-4 py-2 rounded shadow transition-colors">
          Test Login with API
        </button>
      }
    </div>
    <!-- END TEMPORARY TEST BLOCK -->
    <router-outlet></router-outlet>
  </main>
</div>

services:
  db:
    image: postgres:17
    container_name: channelo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: channelo
      POSTGRES_PASSWORD: channelo123
      POSTGRES_DB: channelodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: channelo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@channelo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: